name: traceforge

services:
  kafka:
    # Official Apache image in KRaft mode (bitnami/kafka:3.7 was removed from Docker Hub).
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "12"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      # Keep the passwordless dev `default` user; allow-network.xml opens it to the Docker network.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/users.d/allow-network.xml:/etc/clickhouse-server/users.d/allow-network.xml:ro
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: collector } }
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9101:9101"   # admin/metrics
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  sampler:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: sampler } }
    ports: ["9102:9102"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  writer:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: writer } }
    ports: ["9103:9103"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
      CLICKHOUSE_ADDR: "clickhouse:9000"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  query:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: query } }
    ports:
      - "8080:8080"
      - "9104:9104"
    environment:
      CLICKHOUSE_ADDR: "clickhouse:9000"
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  ch-data:
