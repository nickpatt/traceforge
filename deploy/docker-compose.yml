name: traceforge

services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "12"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  collector:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: collector } }
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9101:9101"   # admin/metrics
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  sampler:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: sampler } }
    ports: ["9102:9102"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka: { condition: service_healthy }

  writer:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: writer } }
    ports: ["9103:9103"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
      CLICKHOUSE_ADDR: "clickhouse:9000"
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  query:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: query } }
    ports:
      - "8080:8080"
      - "9104:9104"
    environment:
      CLICKHOUSE_ADDR: "clickhouse:9000"
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  ch-data:
